# Independent executable protocol; see docs/implementation.md for assumptions.
imgsz: 640
batch: 8
epochs: 100
pretrained: false
optimizer: AdamW
lr0: 0.001
weight_decay: 0.0005
cos_lr: true
lrf: 0.01
warmup_epochs: 3
box: 7.5
cls: 0.5
dfl: 1.5
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
translate: 0.1
scale: 0.5
fliplr: 0.5
flipud: 0.0
mosaic: 1.0
close_mosaic: 10
mixup: 0.0
cutmix: 0.0
amp: true
deterministic: true
patience: 100
save_period: 1
workers: 2
